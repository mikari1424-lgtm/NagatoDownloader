<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NagatoDownloader</title>
    <link rel="icon" type="image/png" href="/static_icons/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1 id="app-title">NagatoDownloader</h1>
        <div style="display:flex; align-items:center; gap:16px">
            <div>
                <span class="status-dot" id="conn-status"></span>
                <span id="conn-text" data-i18n="connecting">Connecting...</span>
            </div>
            <select id="lang-switcher" onchange="switchLanguage(this.value)" style="background:#1a1d21; border:1px solid #3a3f48; color:#e4e6eb;
                       padding:4px 8px; border-radius:4px; font-size:12px; cursor:pointer">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <nav>
        <button data-tab="manual" class="active" data-i18n="nav_manual">手动下载</button>
        <button data-tab="bookmark" data-i18n="nav_bookmark">收藏夹导入</button>
        <button data-tab="recommend" data-i18n="nav_recommend">作品推荐</button>
        <button data-tab="follow" data-i18n="nav_follow">已关注新作</button>
        <button data-tab="ranking" data-i18n="nav_ranking">排行榜</button>
        <button data-tab="search" data-i18n="nav_search">标签搜索</button>
        <button data-tab="user-search" data-i18n="nav_user_search">用户搜索</button>
        <button data-tab="user-detail" data-i18n="nav_user_detail">用户详情</button>
        <button data-tab="settings" data-i18n="nav_settings">设置</button>
    </nav>

    <main>
        <!-- Manual -->
        <div class="tab active" id="tab-manual">
            <div class="panel">
                <h3 data-i18n="manual_single">单个添加</h3>
                <div class="row">
                    <input type="text" id="manual-url" data-i18n-placeholder="manual_url_ph" style="flex:1">
                    <button class="primary add-queue-btn" onclick="addSingleUrl()" data-i18n="btn_enqueue">加入队列</button>
                </div>
            </div>
            <div class="panel">
                <h3 data-i18n="manual_batch">批量添加（每行一个）</h3>
                <textarea id="manual-batch" rows="8" style="width:100%"></textarea>
                <div class="row" style="margin-top:10px">
                    <button class="primary add-queue-btn" onclick="addBatchUrls()"
                        data-i18n="btn_batch_enqueue">批量加入队列</button>
                </div>
            </div>
        </div>

        <!-- Bookmark -->
        <div class="tab" id="tab-bookmark">
            <div class="panel">
                <h3 data-i18n="bookmark_select">选择收藏夹 HTML 文件</h3>
                <div class="row">
                    <input type="file" id="bookmark-file" accept=".html,.htm">
                    <button class="primary" onclick="parseBookmark()" data-i18n="btn_parse">解析链接</button>
                </div>
                <div id="bookmark-preview"
                    style="margin-top:10px; max-height:300px; overflow-y:auto; font-family:monospace; font-size:12px;">
                </div>
                <div class="row" style="margin-top:10px">
                    <button class="primary add-queue-btn" onclick="addBookmarkUrls()" id="bookmark-add-btn" disabled
                        data-i18n="btn_enqueue_all">全部加入队列</button>
                </div>
            </div>
        </div>

        <!-- Recommend -->
        <div class="tab sticky-results" id="tab-recommend">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="rec_mode">推荐模式:</label>
                    <button class="primary" onclick="doRecommend('auto')" id="btn-rec-auto"
                        data-i18n="rec_auto">自动推荐</button>
                    <button class="secondary" onclick="doRecommend('queue')" data-i18n="rec_queue">根据下载队列</button>
                    <button class="secondary" onclick="doRecommend('history')" data-i18n="rec_history">根据历史记录</button>
                    <span class="status-text" id="recommend-status"></span>
                </div>
                <div class="row">
                    <label data-i18n="rec_from_work">根据作品:</label>
                    <input type="number" id="recommend-pid" data-i18n-placeholder="rec_pid_ph" style="width:150px">
                    <button class="secondary" onclick="doRecommend('work')" data-i18n="rec_similar">推荐相似作品</button>
                    <button class="secondary" onclick="openAdvancedRecommend()"
                        data-i18n="rec_advanced">高级推荐...</button>
                </div>
            </div>
            <div class="panel results-panel">
                <div id="recommend-list"></div>
            </div>
        </div>

        <!-- Follow -->
        <div class="tab sticky-results" id="tab-follow">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="follow_scope">作品范围:</label>
                    <select id="follow-restrict">
                        <option value="all" data-i18n="follow_all">全部</option>
                        <option value="public" data-i18n="follow_public">公开</option>
                        <option value="private" data-i18n="follow_private">私密</option>
                    </select>
                    <button class="primary" onclick="loadFollowNew(0)" id="btn-load-follow"
                        data-i18n="follow_load">加载新作</button>
                    <span class="status-text" id="follow-status"></span>
                </div>
                <div class="row">
                    <button class="secondary" onclick="followPrevPage()" data-i18n="btn_prev">上一页</button>
                    <button class="secondary" onclick="followNextPage()" data-i18n="btn_next">下一页</button>
                    <span id="follow-page-info" style="color:#808590; font-size:12px"></span>
                </div>
            </div>
            <div class="panel results-panel">
                <div id="follow-list"></div>
            </div>
        </div>

        <!-- Ranking -->
        <div class="tab sticky-results" id="tab-ranking">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="ranking_type">类型:</label>
                    <select id="ranking-mode">
                        <option value="day" data-i18n="ranking_day">日榜</option>
                        <option value="week" data-i18n="ranking_week">周榜</option>
                        <option value="month" data-i18n="ranking_month">月榜</option>
                        <option value="day_male" data-i18n="ranking_day_male">男性向</option>
                        <option value="day_female" data-i18n="ranking_day_female">女性向</option>
                        <option value="week_original" data-i18n="ranking_week_original">原创</option>
                        <option value="week_rookie" data-i18n="ranking_week_rookie">新人</option>
                        <option value="day_r18" data-i18n="ranking_day_r18">R-18</option>
                    </select>
                    <label data-i18n="label_count">数量:</label>
                    <input type="number" id="ranking-limit" value="30" min="1" max="500" style="width:80px">
                    <button class="primary" onclick="fetchRanking()" id="btn-fetch-ranking"
                        data-i18n="btn_fetch_ranking">获取排行榜</button>
                    <span class="status-text" id="ranking-status"></span>
                </div>
                <div class="row">
                    <label data-i18n="label_filter">标签筛选:</label>
                    <input type="text" id="ranking-filter" data-i18n-placeholder="filter_ph"
                        style="flex:1; max-width:400px" oninput="filterRankingByTags()">
                    <button class="secondary" onclick="clearRankingFilter()" data-i18n="btn_clear">清除</button>
                    <span class="status-text" id="ranking-filter-status"></span>
                </div>
                <div class="tag-cloud" id="ranking-tag-cloud"></div>
            </div>
            <div class="panel results-panel">
                <div id="ranking-list"></div>
            </div>
        </div>

        <!-- Search -->
        <div class="tab sticky-results" id="tab-search">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="search_tag">标签:</label>
                    <input type="text" id="search-tag" data-i18n-placeholder="search_tag_ph" style="width:180px">
                    <label data-i18n="search_sort">排序:</label>
                    <select id="search-sort">
                        <option value="date_desc" data-i18n="sort_newest">最新</option>
                        <option value="date_asc" data-i18n="sort_oldest">最早</option>
                        <option value="popular_desc" data-i18n="sort_popular">最热</option>
                    </select>
                </div>
                <div class="row">
                    <label data-i18n="search_page">页码:</label>
                    <input type="number" id="search-page" value="1" min="1" style="width:70px">
                    <label data-i18n="search_pages">页数:</label>
                    <input type="number" id="search-pages" value="1" min="1" max="50" style="width:70px">
                    <button class="secondary" onclick="searchPrev()" data-i18n="btn_prev">上一页</button>
                    <button class="secondary" onclick="searchNext()" data-i18n="btn_next">下一页</button>
                    <button class="secondary" onclick="searchBackward()" data-i18n="btn_backward">← 向前</button>
                    <button class="secondary" onclick="searchForward()" data-i18n="btn_forward">向后 →</button>
                    <button class="primary" onclick="doSearch()" id="btn-search" data-i18n="btn_search">搜索</button>
                    <span class="status-text" id="search-status"></span>
                </div>
                <div class="row">
                    <label data-i18n="label_filter_type">过滤:</label>
                    <label><input type="checkbox" id="f-illust" checked> <span
                            data-i18n="filter_illust">插画</span></label>
                    <label><input type="checkbox" id="f-manga" checked> <span data-i18n="filter_manga">漫画</span></label>
                    <label><input type="checkbox" id="f-novel"> <span data-i18n="filter_novel">小说</span></label>
                </div>
            </div>
            <div class="panel results-panel">
                <div id="search-list"></div>
            </div>
        </div>

        <!-- User search -->
        <div class="tab sticky-results" id="tab-user-search">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="usearch_word">关键词:</label>
                    <input type="text" id="usearch-word" data-i18n-placeholder="usearch_ph" style="width:240px">
                    <label data-i18n="search_page">页码:</label>
                    <input type="number" id="usearch-page" value="1" min="1" style="width:70px">
                    <button class="primary" id="btn-user-search" onclick="doUserSearch()"
                        data-i18n="usearch_btn">搜索用户</button>
                    <span class="status-text" id="usearch-status"></span>
                </div>
            </div>
            <div class="panel results-panel">
                <div id="usearch-list"></div>
            </div>
        </div>

        <!-- User detail -->
        <div class="tab sticky-results" id="tab-user-detail">
            <div class="panel controls">
                <div class="row">
                    <label data-i18n="udetail_uid">UID:</label>
                    <input type="number" id="udetail-uid" data-i18n-placeholder="udetail_uid_ph" style="width:150px">
                    <button class="primary" id="btn-load-udetail" onclick="loadUserDetailFromInput()"
                        data-i18n="udetail_load">加载用户</button>
                    <span class="status-text" id="udetail-status"></span>
                </div>
                <div id="udetail-header" style="margin-top:8px"></div>
                <div class="row" style="margin-top:8px">
                    <label data-i18n="label_filter">标签筛选:</label>
                    <input type="text" id="udetail-filter" data-i18n-placeholder="filter_ph"
                        style="flex:1; max-width:400px" oninput="applyUserDetailFilter()">
                    <button class="secondary" onclick="clearUserDetailFilter()" data-i18n="btn_clear">清除</button>
                    <span class="status-text" id="udetail-filter-status"></span>
                </div>
                <div class="tag-cloud" id="udetail-tag-cloud"></div>
            </div>
            <div class="panel results-panel">
                <div id="user-detail-list"></div>
            </div>
        </div>

        <!-- Settings -->
        <div class="tab" id="tab-settings">
            <div class="panel">
                <h3 data-i18n="settings_account">账号</h3>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_token">刷新令牌:</label>
                    <input type="text" id="cfg-refresh_token" style="flex:1" data-i18n-placeholder="token_ph">
                    <a href="#" onclick="event.preventDefault(); showTokenHelp(); return false;"
                        style="color:#7eb6ff; text-decoration:none; font-size:18px; padding:0 6px;"
                        data-i18n-title="token_help_title">❓</a>
                </div>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_language">语言:</label>
                    <select id="cfg-language" style="flex:1">
                        <option value="auto" data-i18n="lang_auto">自动</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="row">
                    <button class="primary" onclick="saveConfig()" data-i18n="btn_save">保存设置</button>
                    <button class="secondary" onclick="testLogin()" data-i18n="btn_test_login">测试登录</button>
                    <button class="secondary" onclick="testLatency()" data-i18n="btn_test_latency">测试延迟</button>
                </div>
            </div>
            <div class="panel">
                <h3 data-i18n="settings_download">下载</h3>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_dir">下载目录:</label>
                    <input type="text" id="cfg-download_dir" style="flex:1">
                </div>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_proxy">代理:</label>
                    <input type="text" id="cfg-proxy" style="flex:1" placeholder="socks5://127.0.0.1:1080">
                </div>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_dl_delay">下载延迟(秒):</label>
                    <input type="number" id="cfg-download_delay" step="0.1" min="0" style="width:100px">
                    <label class="label-wide" data-i18n="settings_api_delay">API延迟(秒):</label>
                    <input type="number" id="cfg-api_request_delay" step="0.1" min="0" style="width:100px">
                </div>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_workers">并行线程(1-8):</label>
                    <input type="number" id="cfg-parallel_workers" min="1" max="8" style="width:100px">
                    <label class="label-wide" data-i18n="settings_max_retries">最大重试:</label>
                    <input type="number" id="cfg-max_retries" min="1" style="width:100px">
                </div>
                <div class="row">
                    <label class="label-wide" data-i18n="settings_rate_delay">限速等待(秒):</label>
                    <input type="number" id="cfg-rate_limit_retry_delay" min="1" style="width:100px">
                    <label class="label-wide" data-i18n="settings_max_results">默认结果数:</label>
                    <input type="number" id="cfg-max_results" min="1" max="500" style="width:100px">
                </div>
            </div>
        </div>
    </main>

    <footer>
        <span><span data-i18n="footer_queue">队列:</span> <b id="queue-count">0</b></span>
        <span><span data-i18n="footer_failed">失败:</span> <b id="failed-count">0</b></span>
        <button class="primary" onclick="addSelectedToQueue()" id="btn-add-selected" disabled>
            <span data-i18n="btn_add_selected">加入选中到队列</span> (0)
        </button>
        <button class="secondary" onclick="recommendFromSelected()" id="btn-recommend-selected" disabled>
            <span data-i18n="btn_recommend_selected">根据选中推荐</span> (0)
        </button>
        <span style="flex:1"></span>
        <button class="primary" onclick="startQueue()" id="btn-start" data-i18n="btn_start_queue">开始下载队列</button>
        <button class="secondary" onclick="stopQueue()" id="btn-stop" disabled data-i18n="btn_stop">停止</button>
        <button class="secondary" onclick="clearQueue()" data-i18n="btn_clear_queue">清空队列</button>
        <button class="secondary" onclick="retryFailed()" data-i18n="btn_retry_failed">重试失败作品</button>
    </footer>

    <div class="logs" id="logs">
        <div class="logs-header" onclick="toggleLogs()">
            <span data-i18n="logs_title">📋 日志</span>
            <span id="log-toggle">▼</span>
        </div>
        <div class="logs-body" id="logs-body"></div>
    </div>

    <!-- Advanced recommend modal -->
    <div class="modal-overlay" id="advanced-rec-modal">
        <div class="modal-content" style="max-width:700px">
            <button class="modal-close" onclick="closeAdvancedRecommend()">×</button>
            <h3 style="color:#7eb6ff; margin-bottom:12px" data-i18n="adv_title">高级推荐参数</h3>

            <div class="adv-param">
                <label data-i18n="adv_seeds">种子作品 ID（bookmark_illust_ids）</label>
                <input type="text" id="adv-seeds" data-i18n-placeholder="adv_seeds_ph" style="width:100%">
                <div class="adv-hint" data-i18n="adv_seeds_hint"></div>
            </div>

            <div class="adv-param">
                <label data-i18n="adv_viewed">已浏览作品 ID（viewed）</label>
                <input type="text" id="adv-viewed" data-i18n-placeholder="adv_viewed_ph" style="width:100%">
                <div class="adv-hint" data-i18n="adv_viewed_hint"></div>
            </div>

            <div class="adv-param">
                <label>
                    <input type="checkbox" id="adv-ranking">
                    <span data-i18n="adv_ranking"></span>
                </label>
                <div class="adv-hint" data-i18n="adv_ranking_hint"></div>
            </div>

            <div class="adv-param">
                <label>
                    <input type="checkbox" id="adv-privacy">
                    <span data-i18n="adv_privacy"></span>
                </label>
                <div class="adv-hint" data-i18n="adv_privacy_hint"></div>
            </div>

            <div class="adv-param">
                <label data-i18n="adv_limit">返回数量上限</label>
                <input type="number" id="adv-limit" value="60" min="1" max="120" style="width:100px">
                <div class="adv-hint" data-i18n="adv_limit_hint"></div>
            </div>

            <div class="row" style="margin-top:16px; justify-content:flex-end">
                <button class="secondary" onclick="closeAdvancedRecommend()" data-i18n="btn_cancel">取消</button>
                <button class="primary" onclick="submitAdvancedRecommend()" data-i18n="btn_execute">执行推荐</button>
            </div>
        </div>
    </div>

    <!-- Token help modal -->
    <div class="modal-overlay" id="token-help-modal">
        <div class="modal-content" style="max-width:640px">
            <button class="modal-close" onclick="closeTokenHelp()">×</button>
            <h3 style="color:#7eb6ff; margin-bottom:16px" data-i18n="token_help_title"></h3>
            <div id="token-help-body" style="color:#c5c8cf; font-size:13px; line-height:1.7"></div>
            <div class="row" style="margin-top:16px; justify-content:flex-end">
                <button class="secondary" onclick="closeTokenHelp()" data-i18n="btn_close">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/main.js"></script>
</body>

</html>
